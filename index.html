<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche RCB Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="sunset-banner" role="alert" data-t="tuyaNoticeHtml"></div>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="log-opt">
      <span data-t="showallLabel"></span>
      <input type="checkbox" id="showall">
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-act="connect"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="controlsHint"></p>
    <div class="set-row">
      <label data-t="lblLocalKey"></label>
      <input id="localkey-in" type="text" autocomplete="off" spellcheck="false" data-t-ph="localKeyPh">
    </div>
    <div class="set-row">
      <label data-t="lblSrand"></label>
      <input id="srand-in" type="text" autocomplete="off" spellcheck="false" data-t-ph="srandPh">
    </div>
    <p class="hint"><span data-t="derivedPrefix"></span> <b id="derived-key">-</b></p>
    <p class="hint" data-t="keysHint"></p>
    <div class="card-head"><label data-t="lblLogUpload"></label><button type="button" class="help-btn" data-help="logupload" aria-label="Info">?</button></div>
    <input type="file" id="log-in" accept=".log,.gz,.zip,.txt,application/zip,application/gzip">
    <p class="hint" id="log-name"></p>
    <p class="hint" data-t="logUploadHint"></p>
  </div>

  <div class="card" id="live-card" hidden>
    <div class="card-head"><h2 data-t="liveTitle"></h2><button type="button" class="help-btn" data-help="live" aria-label="Info">?</button></div>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card" id="batt-card" hidden>
    <div class="card-head"><h2 data-t="battTitle"></h2><button type="button" class="help-btn" data-help="batt" aria-label="Info">?</button></div>
    <p class="hint" data-t="battHint"></p>
  </div>

  <div class="card" id="more-card" hidden>
    <div class="card-head"><h2 data-t="moreTitle"></h2><button type="button" class="help-btn" data-help="more" aria-label="Info">?</button></div>
    <p class="hint" data-t="moreHint"></p>

    <div class="set-row">
      <label data-t="lblSchema"></label>
      <input id="schema-in" type="text" autocomplete="off" spellcheck="false" data-t-ph="schemaPh">
    </div>
    <div class="btns">
      <button type="button" id="btn-load-schema" data-t="btnLoadSchema"></button>
      <button type="button" id="btn-clear-schema" data-t="btnClearSchema"></button>
    </div>
    <p class="hint" data-t="schemaHint"></p>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <p class="hint" data-t="speedNote"></p>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <div id="settings-rows"></div>
  </div>

  <div class="card" id="raw-card" hidden>
    <div class="card-head"><h2 data-t="rawTitle"></h2><button type="button" class="help-btn" data-help="expert" aria-label="Info">?</button></div>
    <p class="warn" data-t="expertHint"></p>
    <div class="set-row">
      <label data-t="lblDpId"></label>
      <input id="dpid-in" type="number" min="1" max="255" data-t-ph="dpIdPh">
    </div>
    <div class="set-row">
      <label data-t="lblDpType"></label>
      <select id="dptype-in">
        <option value="value" data-t="dtValue"></option>
        <option value="enum" data-t="dtEnum"></option>
        <option value="bool" data-t="dtBool"></option>
        <option value="string" data-t="dtString"></option>
        <option value="raw" data-t="dtRaw"></option>
      </select>
    </div>
    <div class="set-row">
      <label data-t="lblDpVal"></label>
      <input id="dpval-in" type="text" data-t-ph="dpValPh">
    </div>
    <div class="set-row">
      <label data-t="lblPv"></label>
      <select id="pv-in">
        <option value="3" data-t="pv3"></option>
        <option value="4" data-t="pv4"></option>
      </select>
    </div>
    <div class="set-row">
      <label data-t="lblArm"></label>
      <select id="arm-in"><option value="0" data-t="armPreview"></option><option value="1" data-t="armLive"></option></select>
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-dpsend" data-t="btnBuildSend"></button>
    </div>
    <p class="hint" data-t="rawHint"></p>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="Info">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="Info">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/rcb-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="doc-head">
    <h3 id="confirm-title" data-t="confirmTitle"></h3>
    <button type="button" id="confirm-x">&times;</button>
  </div>
  <div class="doc-body"><p id="confirm-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="confirm-no" data-t="confirmCancel"></button>
    <button type="button" id="confirm-ok" class="primary" data-t="confirmOk"></button>
  </div>
</dialog>

<script src="report-footer.js?v=4"></script>
<script src="i18n.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
